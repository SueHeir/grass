name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # grass_mpi's default feature `mpi_backend` links libmpi, so the
      # workspace build needs an MPI implementation present at compile time
      # even when no MPI example is being run.
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install oscillator evidence Python dependencies
        run: python3 -m pip install --user numpy scipy matplotlib

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: LocalTransport two-binary oscillator contract
        run: cargo test --example oscillator_mpmd_local

      # Verify the MPI integration compiles. grass_multi's `mpi` feature pulls
      # in grass_mpi's mpi_backend (which links libmpi) and the distributed
      # sub-app path. We build rather than run under mpirun — that needs a
      # working OpenMPI launcher and adds flakiness for little gain.
      - name: cargo build --features mpi (MPI integration)
        run: cargo build -p grass_multi --features mpi --all-targets

      - name: MPMD oscillator transport trajectory
        run: |
          cargo build --features mpi --example oscillator_mpmd_a --example oscillator_mpmd_b
          ./examples/oscillator_mpmd/run_mpmd.sh

      - name: Reproducible oscillator showcase (schemes + LocalTransport + MPI)
        run: python3 examples/oscillator_coupling_schemes/showcase.py

      - name: cargo doc (broken intra-doc links = error)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # Documentation-coverage gate. Every library crate opts in with
      # `#![warn(missing_docs)]`; `-D warnings` flips that warn to a hard error
      # so no public API can merge undocumented. Scoped to `--lib` so it gates
      # the crates' public surface, not examples/tests/binaries.
      - name: missing_docs gate (public API doc coverage = deny)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --workspace --lib
