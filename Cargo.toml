[package]
name = "grass-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Top-level runnable examples for the grass simulation framework"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elizabeth-suehr/grass"

[workspace.dependencies]
# Inter-crate paths so cargo resolves them inside this workspace.
grass_scheduler = { path = "crates/grass_scheduler", version = "0.1.0" }
grass_app       = { path = "crates/grass_app",       version = "0.1.0" }
grass_io        = { path = "crates/grass_io",        version = "0.1.0" }
grass_mpi       = { path = "crates/grass_mpi",       version = "0.1.0", default-features = false }
grass_derive    = { path = "crates/grass_derive",    version = "0.1.0" }
grass_multi     = { path = "crates/grass_multi",     version = "0.1.0" }
oscillator_demo = { path = "crates/oscillator_demo", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
grass_scheduler = { workspace = true }
grass_app = { workspace = true }
grass_io = { workspace = true }
grass_multi = { workspace = true }
grass_mpi = { workspace = true, optional = true }
oscillator_demo = { workspace = true }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
mpi = ["grass_multi/mpi", "dep:grass_mpi", "grass_mpi/mpi_backend"]

[[example]]
name = "oscillator_demo"
path = "examples/oscillator_demo/main.rs"

[[example]]
name = "contract_reference"
path = "examples/contract_reference/main.rs"

[[example]]
name = "composite_system_param_validation"
path = "examples/composite_system_param_validation/main.rs"

[[example]]
name = "oscillator_coupling_schemes"
path = "examples/oscillator_coupling_schemes/main.rs"

[[example]]
name = "oscillator_mpmd_local"
path = "examples/oscillator_mpmd/local.rs"

[[example]]
name = "oscillator_mpmd_a"
path = "examples/oscillator_mpmd/a.rs"
required-features = ["mpi"]

[[example]]
name = "oscillator_mpmd_b"
path = "examples/oscillator_mpmd/b.rs"
required-features = ["mpi"]
