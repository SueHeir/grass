[package]
name = "grass_mpi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MPI abstraction for GRASS: CommBackend trait, the shared CommResource and the MpiPlugin that installs it once per App"
keywords = ["mpi", "communication", "simulation"]
categories = ["simulation", "science"]

[features]
default = ["mpi_backend"]
mpi_backend = ["dep:mpi", "dep:libffi-sys"]

[dependencies]
grass_app = { workspace = true }
mpi = { version = "0.8.0", features = ["user-operations", "derive"], optional = true }
libffi-sys = { version = "2.3.0", features = ["system"], optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
toml = "0.8"
