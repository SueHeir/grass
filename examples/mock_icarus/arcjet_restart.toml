# Restart the cooldown from the checkpoint written at the end of the
# exposure. The Fortran state (temperature, decomposition, recession) comes
# back through the same checkpoint file as every other GRASS resource.

[ablator]
thickness = 0.05
cells = 100
dt = 0.05

[arcjet]
q_cw = 0.0
h_r = 20.0
blowing = true

[term_out]
every = 400
columns = ["time", "T_wall", "T_back", "recession_mm", "mdot_gas", "q_conv_Wcm2"]

[checkpoint]
restart = "../arcjet/checkpoints/checkpoint_0000000600.grass"

[output]
dir = "out/arcjet_restart"

[run]
name = "cooldown"
steps = 1200
