# A capsule flying a Stardust-like lunar-return entry, with the Fortran
# ablator under four heatshield stations, coupled to the C aeroheating code.

[coupling]
scheme = "implicit"     # or "explicit"
window = 0.5            # s; the flow code takes one step per window
tps_substeps = 5        # ablator steps per window (0.1 s each)
final_time = 80.0       # s after entry interface
acceleration = "iqn"    # implicit only: iqn | aitken | picard
tol = 1e-6              # kg/m2/s, on the blowing-rate residual

[output]
dir = "out/entry"

# ---- the flow code (sub-App "flow") ----
[flow.aero]
stations_deg = [0.0, 20.0, 40.0, 60.0]
nose_radius = 0.22              # m
ballistic_coefficient = 60.0    # kg/m2
entry_velocity = 11500.0        # m/s
entry_angle_deg = -8.0
entry_altitude = 125000.0       # m
dt = 0.5                        # overridden by [coupling] window

# ---- the material-response code (sub-App "tps") ----
[tps.ablator]
stations = 4
thickness = 0.04                # m
cells = 80
dt = 0.1                        # overridden by window / tps_substeps
