# Declarative validation matrix for the fallible app lifecycle example.
[checks]
plugin_build_failure = true
plugin_group_short_circuit = true
nested_plugin_error_propagation = true
setup_failure = true
update_stops_after_setup_failure = true
cleanup = true
cleanup_after_duplicate_registration_error = true
cleanup_after_missing_dependency_error = true
cleanup_after_prepare_capability_error = true
cleanup_after_start_capability_error = true
legacy_compatibility = true
