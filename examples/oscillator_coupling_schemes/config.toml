# The policies differ only in parent-side exchange, rollback, relaxation, and retry.
[case]
final_time = 0.04
nominal_dt = 0.01
adaptive_initial_dt = 0.02
minimum_dt = 0.01
picard_tolerance = 1.0e-9
picard_max_iterations = 14
# Conservative fixed under-relaxation, deliberately not the q-specific optimum.
relaxation = 0.7

[a.oscillator]
x0 = 1.0
v0 = 0.0
peer_x0 = -1.0
stiffness = 1.0
damping = 0.0
coupling_stiffness = 2000.0
mass = 1.0
dt = 0.01

[b.oscillator]
x0 = -1.0
v0 = 0.0
peer_x0 = 1.0
stiffness = 1.0
damping = 0.0
coupling_stiffness = 2000.0
mass = 1.0
dt = 0.01
