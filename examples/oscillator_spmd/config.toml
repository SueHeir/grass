# Single declarative document for the single-binary SPMD oscillator.
#
# `mode = "auto"` is the whole point of this example: the *same* binary and the
# *same* config compose the two roles locally at world size 1 and split them
# across ranks under `mpirun -np 2`, with no source or config change. The
# `local.toml` / `split.toml` siblings pin the mode explicitly to demonstrate
# the fail-closed validation.
[topology]
mode = "auto"

[[topology.role]]
name = "a"
ranks = 1

[[topology.role]]
name = "b"
ranks = 1

[case]
steps = 40

[a.oscillator]
x0 = 1.0
v0 = 0.0
peer_x0 = -0.5
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025

[b.oscillator]
x0 = -0.5
v0 = 0.0
peer_x0 = 1.0
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025
