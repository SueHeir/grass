# Explicit `mode = "split"`: split MPI_COMM_WORLD into one role-local
# communicator per role. Requires exactly `sum(ranks)` launched ranks
# (`mpirun -np 2`); any other world size is rejected (fail-closed). Running it
# serially is rejected too. Physics is identical to config.toml.
[topology]
mode = "split"

[[topology.role]]
name = "a"
ranks = 1

[[topology.role]]
name = "b"
ranks = 1

[case]
steps = 40

[a.oscillator]
x0 = 1.0
v0 = 0.0
peer_x0 = -0.5
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025

[b.oscillator]
x0 = -0.5
v0 = 0.0
peer_x0 = 1.0
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025
