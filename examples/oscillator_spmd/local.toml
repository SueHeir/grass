# Explicit `mode = "local"`: compose both roles in one process. Launching this
# under `mpirun -np 2` is rejected (fail-closed) rather than silently running
# two duplicate serial copies. Physics is identical to config.toml.
[topology]
mode = "local"

[[topology.role]]
name = "a"
ranks = 1

[[topology.role]]
name = "b"
ranks = 1

[case]
steps = 40

[a.oscillator]
x0 = 1.0
v0 = 0.0
peer_x0 = -0.5
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025

[b.oscillator]
x0 = -0.5
v0 = 0.0
peer_x0 = 1.0
stiffness = 1.0
damping = 0.0
coupling_stiffness = 0.2
mass = 1.0
dt = 0.0025
